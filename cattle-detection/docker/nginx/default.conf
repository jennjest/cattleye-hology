# CATTLEYE - nginx reverse proxy in front of php-fpm.
# Replaces the host-level nginx that served /var/www/cattleye-hology/cattle-detection.

server {
    listen 80;
    listen [::]:80;

    # Override with a real hostname once DNS is pointed at the host.
    server_name _;

    root /var/www/html/public;
    index index.php;
    charset utf-8;

    # Matches post_max_size in docker/php/php.ini.
    client_max_body_size 16M;

    # Vite build with hashed assets; Laravel/Inertia sends no-store on HTML.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        text/css
        text/plain
        text/xml;

    access_log /var/log/nginx/cattleye-access.log;
    error_log /var/log/nginx/cattleye-error.log warn;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Inertia needs these to detect XHR navigations.
    location ~ ^/index\.php(/|$) {
        fastcgi_pass app:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 120;
        fastcgi_buffer_size 64k;
        fastcgi_buffers 8 64k;
        fastcgi_busy_buffers_size 128k;
        include fastcgi_params;
    }

    # Every other .php path is a direct hit on application code; refuse it.
    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    # Vite emits content-hashed files under /build, so they are safe to pin.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
