; CATTLEYE production PHP settings.
; Tuned for a 1 GB VPS: the container shares the host with MariaDB and nginx.

memory_limit = 256M

; Notifications and the fusion sync both do modest HTTP calls to the Pi.
; CATTLEYE_EDGE_TIMEOUT is 5s; leave headroom above it.
max_execution_time = 60

; Multipart ceiling for avatar/passkey uploads. Matches client_max_body_size
; in docker/nginx/default.conf.
upload_max_filesize = 12M
post_max_size = 16M

expose_php = Off

; Deterministic timestamps keep cache keys stable across php-fpm workers.
date.timezone = UTC

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 96
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 12000
opcache.validate_timestamps = 0
opcache.save_comments = 1
