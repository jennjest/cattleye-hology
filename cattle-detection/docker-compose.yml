# =============================================================================
# CATTLEYE - production compose stack
#
#   db       MariaDB 11.4
#   migrate  one-shot: waits for db, compiles caches, applies migrations
#   app      php-fpm workers
#   queue    notification queue worker
#   web      nginx, the only published port
#
# Bring it up with:  docker compose up -d --build
#
# Runtime secrets live in .env.docker (gitignored), never in this file.
# =============================================================================

name: cattleye

x-app-env: &app-env
  env_file:
    - .env.docker
  environment:
    # Service-to-service DNS name; overrides whatever the host app would use.
    DB_CONNECTION: mysql
    DB_HOST: db
    DB_PORT: "3306"
    APP_ENV: production
    APP_DEBUG: "false"

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-connections=60
    # MARIADB_DATABASE / MARIADB_USER / MARIADB_PASSWORD / MARIADB_ROOT_PASSWORD
    # come straight from .env.docker. They intentionally mirror DB_* so a single
    # file describes the whole stack, but the names differ because that is what
    # the MariaDB entrypoint reads.
    env_file:
      - .env.docker
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD
        - healthcheck.sh
        - --connect
        - --innodb_initialized
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M

  migrate:
    build:
      context: .
      target: runtime
    image: cattleye/app:latest
    restart: "no"
    <<: *app-env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      RUN_PREPARE: "true"
    command: ["php", "artisan", "migrate", "--force"]
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      target: runtime
    image: cattleye/app:latest
    restart: unless-stopped
    <<: *app-env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 320M

  queue:
    build:
      context: .
      target: runtime
    image: cattleye/app:latest
    restart: unless-stopped
    <<: *app-env
    healthcheck:
      disable: true
    command:
      - php
      - artisan
      - queue:work
      - --queue=notifications
      - --sleep=3
      - --tries=3
      - --backoff=10
      - --verbose
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 192M

  web:
    build:
      context: .
      target: web
    image: cattleye/web:latest
    restart: unless-stopped
    ports:
      # Host port 80 is already taken by the host-level nginx serving this app.
      # Set WEB_PORT=80 in .env.docker after stopping that nginx.
      - "${WEB_PORT:-8080}:80"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  db_data:
